name: Build HID Explorer

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore
        run: dotnet restore Mikrofine-MultiMouseControlCenter.sln

      - name: Build
        run: dotnet build Mikrofine-MultiMouseControlCenter.sln --configuration Release --no-restore
